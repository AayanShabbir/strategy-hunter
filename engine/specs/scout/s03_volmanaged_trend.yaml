id: s03_volmanaged_trend_v1
author: scout
hypothesis: "Volatility-managed exposure (Moreira & Muir 2017, JF) as long/flat: hold the ETF only when price > SMA(slow) AND ATR20/price is below a calm cap; exit in high-vol regimes. Should improve risk-adjusted return and beat buy-and-hold OOS after costs."
base:
  idea: sma_cross
  params: {fast: [1], slow: [50, 100, 200]}
filters:
  - {name: vol_regime, params: {n: [20], max_atr_pct: [0.012, 0.015, 0.02]}}
universe:
  SPY: [SPY]
  QQQ: [QQQ]
  SECTORS: [XLK, XLF, XLE, XLV, XLI, XLY, XLP, XLU]
timeframe: 1Day
stop: {atr_mult: 4}
direction: long_flat
costs: {fee_bps: 0, slippage_bps: 5}
min_trades: 100
split: {is_frac: 0.7, wf_folds: 2}
n_random: 1000
